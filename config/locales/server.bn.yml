bn:
  site_settings:
    proxytracer_enabled: সম্পূর্ণ ProxyTracer প্লাগইন সক্রিয় বা নিষ্ক্রিয় করার প্রধান
      টগল।
    ProxyTracer_API_Key: আপনার API টোকেন যা আপনি <a href="https://proxytracer.com/dashboard"
      target="_blank">proxytracer.com</a> থেকে পেতে পারেন।
    API_Timeout_ms: টাইমআউট হওয়ার আগে API প্রতিক্রিয়ার জন্য কতক্ষণ অপেক্ষা করতে
      হবে (মিলিসেকেন্ডে)।
    Cache_Duration_hours: আবার API চেক করার আগে কত ঘণ্টা Redis-এ আইপি ঠিকানা মনে রাখতে
      হবে।
    Fail_Open_on_Error: যদি API ক্র্যাশ করে বা সময় শেষ হয়, তবে সবাইকে লকআউট করা
      এড়াতে নিবন্ধন/লগইন করার অনুমতি দিন।
    Enabled_during_Signup: নতুন ব্যবহারকারী নিবন্ধন করার চেষ্টা করার সময় প্রক্সি
      এবং ভিপিএন ব্লক করুন।
    Enabled_during_Login: বিদ্যমান ব্যবহারকারী লগইন করার চেষ্টা করার সময় প্রক্সি
      এবং ভিপিএন ব্লক করুন।
    Enabled_for_All_Visitors: ফোরামের যেকোনো পৃষ্ঠা অ্যাক্সেস করা থেকে প্রক্সি এবং
      ভিপিএন ব্লক করুন।
    Strict_Auth_Verification: সক্রিয় থাকলে, ফোরাম দেখার জন্য ক্যাপচা সমাধানকারী দর্শকদের
      নিবন্ধন বা লগইনের সময় আলাদা ক্যাপচা সমাধান করতে হবে।
    ProxyTracer_Action: 'প্রক্সি বা ভিপিএন সনাক্ত হলে করণীয়: অ্যাক্সেস ব্লক করুন
      বা ক্যাপচা চ্যালেঞ্জ দিন।'
    ProxyTracer_Captcha_Provider: চ্যালেঞ্জের জন্য ক্যাপচা পরিষেবা (Cloudflare Turnstile
      বা hCaptcha)।
    ProxyTracer_Captcha_Site_Key: Cloudflare Turnstile বা hCaptcha-এর জন্য আপনার সর্বজনীন
      সাইট কী।
    ProxyTracer_Captcha_Secret_Key: Cloudflare Turnstile বা hCaptcha-এর জন্য আপনার
      গোপন সিক্রেট কী।
    ProxyTracer_Captcha_Clearance_hours: ক্যাপচা সফলভাবে সমাধান করার পরে একজন দর্শক
      কত ঘণ্টা যাচাইকৃত থাকবেন।
    Block_Message: ব্যবহারকারী ব্লক হলে প্রদর্শিত সঠিক ত্রুটি বার্তা।
    Whitelisted_IPs: আইপি ঠিকানা বা CIDR রেঞ্জ যা ProxyTracer বাইপাস করার অনুমতিপ্রাপ্ত।
    ProxyTracer_Log_Usernames: ব্লক করা অ্যাকাউন্টের ব্যবহারকারীর নাম লগ করুন।
    ProxyTracer_Stats_TTL_days: দৈনিক পরিসংখ্যান সংরক্ষণের দিনের সংখ্যা।
    ProxyTracer_Show_Branding: ক্যাপচা চ্যালেঞ্জে 'Protected by ProxyTracer' ব্যাজ
      প্রদর্শন করুন।
  dashboard:
    problem:
      proxy_tracer_missing_key: "ProxyTracer নিষ্ক্রিয়! প্রক্সি এবং ভিপিএন ব্লকিং সক্ষম করতে প্লাগইন সেটিংসে আপনার API কী লিখুন।"
      proxy_tracer_missing_captcha_key: "ProxyTracer-এর ক্যাপচা (CAPTCHA) অ্যাকশন সক্রিয় করা হয়েছে, কিন্তু ক্যাপচা সাইট কি (Site Key) বা সিক্রেট কি (Secret Key) কনফিগার করা হয়নি।"
  proxytracer:
    admin_title: ProxyTracer
    error_451: অ্যাক্সেস অস্বীকার করা হয়েছে। আপনি একটি ভিপিএন, প্রক্সি বা টর নেটওয়ার্ক
      ব্যবহার করছেন যা এই ফোরামে অনুমোদিত নয়।
