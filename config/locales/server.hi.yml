hi:
  site_settings:
    proxytracer_enabled: पूरे ProxyTracer प्लगइन को सक्षम या अक्षम करने के लिए मुख्य
      टॉगल।
    ProxyTracer_API_Key: आपका API टोकन जो आप <a href="https://proxytracer.com/dashboard"
      target="_blank">proxytracer.com</a> से प्राप्त कर सकते हैं।
    API_Timeout_ms: समय समाप्त होने से पहले API प्रतिक्रिया की प्रतीक्षा करने का समय
      (मिलीसेकंड में)।
    Cache_Duration_hours: API को फिर से जांचने से पहले कितने घंटे Redis में IP पता
      याद रखना है।
    Fail_Open_on_Error: यदि API क्रैश या टाइमआउट हो जाता है, तो उपयोगकर्ताओं को ब्लॉक
      होने से बचाने के लिए पंजीकरण/लॉगिन की अनुमति दें।
    Enabled_during_Signup: नया उपयोगकर्ता पंजीकरण करते समय प्रॉक्सी और वीपीएन को ब्लॉक
      करें।
    Enabled_during_Login: मौजूदा उपयोगकर्ता लॉगिन करते समय प्रॉक्सी और वीपीएन को ब्लॉक
      करें।
    Enabled_for_All_Visitors: फ़ोरम के किसी भी पृष्ठ तक पहुँचने से प्रॉक्सी और वीपीएन
      को ब्लॉक करें।
    Strict_Auth_Verification: सक्षम होने पर, फ़ोरम देखने के लिए कैप्चा हल करने वाले
      विज़िटर को पंजीकरण या लॉगिन के समय अलग कैप्चा हल करना होगा।
    ProxyTracer_Action: 'प्रॉक्सी या वीपीएन का पता चलने पर कार्रवाई: एक्सेस ब्लॉक
      करें या कैप्चा चुनौती दें।'
    ProxyTracer_Captcha_Provider: चुनौतियों के लिए उपयोग की जाने वाली कैप्चा सेवा
      (Cloudflare Turnstile या hCaptcha)।
    ProxyTracer_Captcha_Site_Key: Cloudflare Turnstile या hCaptcha के लिए आपकी सार्वजनिक
      साइट कुंजी।
    ProxyTracer_Captcha_Secret_Key: Cloudflare Turnstile या hCaptcha के लिए आपकी निजी
      सीक्रेट कुंजी।
    ProxyTracer_Captcha_Clearance_hours: कैप्चा हल करने के बाद विज़िटर कितने घंटे
      सत्यापित रहेगा।
    Block_Message: ब्लॉक होने पर उपयोगकर्ता को दिखाया जाने वाला सटीक त्रुटि संदेश।
    Whitelisted_IPs: IP पते या CIDR रेंज जिन्हें ProxyTracer को बायपास करने की अनुमति
      है।
    ProxyTracer_Log_Usernames: ब्लॉक किए गए खातों के उपयोगकर्ता नाम लॉग करें।
    ProxyTracer_Stats_TTL_days: दैनिक आँकड़ों को Redis में रखने के दिनों की संख्या।
    ProxyTracer_Show_Branding: कैप्चा चुनौतियों पर 'Protected by ProxyTracer' बैज
      प्रदर्शित करें।
  dashboard:
    problem:
      proxy_tracer_missing_key: "ProxyTracer निष्क्रिय है! प्रॉक्सी और वीपीएन ब्लॉकिंग सक्षम करने के लिए प्लगइन सेटिंग्स में अपनी API कुंजी दर्ज करें।"
      proxy_tracer_missing_captcha_key: "ProxyTracer का कैप्चा (CAPTCHA) एक्शन सक्षम है, लेकिन कैप्चा साइट की (Site Key) या सीक्रेट की (Secret Key) कॉन्फ़िगर नहीं की गई है।"
  proxytracer:
    admin_title: ProxyTracer
    error_451: पहुँच अस्वीकृत। हमने पाया है कि आप एक वीपीएन, प्रॉक्सी या टोर नेटवर्क
      का उपयोग कर रहे हैं, जो इस फ़ोरम पर अनुमत नहीं है।
