pt:
  site_settings:
    proxytracer_enabled: Alternador principal para ativar ou desativar todo o plugin
      ProxyTracer.
    ProxyTracer_API_Key: Seu token de API obtido em <a href="https://proxytracer.com/dashboard"
      target="_blank">proxytracer.com</a>.
    API_Timeout_ms: 'Tempo limite de espera pela resposta da API (unidade: milissegundos).'
    Cache_Duration_hours: Tempo em horas para reter um endereço IP no Redis antes
      de consultar a API novamente.
    Fail_Open_on_Error: Se a API falhar ou expirar, permitir cadastro/login para evitar
      bloquear todos.
    Enabled_during_Signup: Bloquear proxies e VPNs quando um novo usuário tentar se
      cadastrar.
    Enabled_during_Login: Bloquear proxies e VPNs quando um usuário existente tentar
      fazer login.
    Enabled_for_All_Visitors: Bloquear acesso de proxies e VPNs a qualquer página
      do fórum.
    Strict_Auth_Verification: Quando ativado, visitantes que resolveram um CAPTCHA
      para visualizar o fórum devem resolver outro ao se cadastrar ou entrar.
    ProxyTracer_Action: 'Ação ao detectar proxy ou VPN: Bloquear acesso ou Desafiar
      com CAPTCHA.'
    ProxyTracer_Captcha_Provider: O serviço de CAPTCHA a ser usado (Cloudflare Turnstile
      ou hCaptcha).
    ProxyTracer_Captcha_Site_Key: Sua chave pública (Site Key) para Cloudflare Turnstile
      ou hCaptcha.
    ProxyTracer_Captcha_Secret_Key: Sua chave privada (Secret Key) para Cloudflare
      Turnstile ou hCaptcha.
    ProxyTracer_Captcha_Clearance_hours: Quantas horas um visitante permanece verificado
      no Redis e cookies após resolver o CAPTCHA.
    Block_Message: A mensagem de erro exata exibida ao usuário bloqueado.
    Whitelisted_IPs: 'Endereços IP ou faixas CIDR (ex.: 192.168.1.0/24) estritamente
      autorizados a ignorar o ProxyTracer.'
    ProxyTracer_Log_Usernames: Registrar nomes de usuário de contas bloqueadas.
    ProxyTracer_Stats_TTL_days: Número de dias para reter estatísticas diárias antes
      de expirarem do Redis.
    ProxyTracer_Show_Branding: Exibir selos e notas de 'Protegido por ProxyTracer'
      em desafios CAPTCHA e na página de verificação.
  dashboard:
    problem:
      proxy_tracer_missing_key: "ProxyTracer está inativo! Insira sua chave de API do ProxyTracer nas configurações do plugin."
      proxy_tracer_missing_captcha_key: "A ação CAPTCHA do ProxyTracer está ativada, mas a Site Key ou a Secret Key do CAPTCHA não foram configuradas."
  proxytracer:
    admin_title: ProxyTracer
    error_451: Acesso negado. Detectamos o uso de VPN, proxy ou rede Tor, o que não
      é permitido neste fórum.
